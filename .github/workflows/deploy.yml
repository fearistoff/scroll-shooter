# Сборка и публикация прототипа на GitHub Pages.
#
# Требует однократной настройки в репозитории: Settings → Pages → Source →
# «GitHub Actions». Без этого workflow отработает, а публикация упадёт на шаге
# deploy-pages с ошибкой про не включённые Pages.
#
# ВАЖНО: этот workflow должен быть в репозитории ЕДИНСТВЕННЫМ, который публикует
# Pages. Автоматически предложенный GitHub'ом jekyll-gh-pages.yml прогонял Jekyll
# по корню репозитория и выкладывал ИСХОДНИКИ: браузер получал исходный index.html
# со ссылкой на /src/main.ts, то есть на TypeScript, который выполнить не может.
# Оба workflow висели на одном событии push и на одной concurrency-группе, так что
# публикацию забирал тот, кто финишировал последним.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Ручной запуск: удобно перевыложить сборку, ничего не коммитя.
  workflow_dispatch:

# Права ровно под задачу: читать код, писать Pages, получить OIDC-токен для
# deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Публикация одна на репозиторий, параллельные деплои друг друга затирают.
# cancel-in-progress: false — идущую публикацию не обрываем, она короткая.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 требует Node 20.19+/22.12+; 22 — текущий LTS.
          node-version: '24'
          # Кеш по package-lock.json — он в репозитории, поэтому npm ci честный.
          cache: npm

      # Именно ci, а не install: ставит строго по package-lock.json и падает, если
      # тот разошёлся с package.json. Разошёлся он однажды и уронил публикацию —
      # после любого npm install lock-файл нужно коммитить.
      - run: npm ci

      # npm run build = tsc --noEmit && vite build: ошибки типов валят публикацию,
      # а не уезжают на прод.
      - run: npm run build

      # configure-pages сам base_path нам не нужен (base сборки './'), но шаг
      # оставлен: это связка из штатного шаблона GitHub, и именно она на этом
      # репозитории уже отработала публикацию без нареканий.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
